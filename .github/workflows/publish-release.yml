name: Publish release

description: >-
  Tags the release commit, builds, tests, publishes to npm,
  mirrors to the public repo, creates a GitHub Release, and notifies Slack.

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish manually
        required: false
        type: string

# Serialize release runs: a manual dispatch must not race the automatic
# post-merge run during tagging, publishing, and mirroring.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    uses: AdGuardSoftwareLimited/ext-shared-actions/.github/workflows/publish-release.yml@master
    with:
      package_file: aglint.tgz
      npm_package_name: "@adguard/aglint"
      target_repo: AdguardTeam/AGLint
      ref: ${{ inputs.ref }}
    secrets: inherit
    permissions:
      # create tag & GitHub release (tag-from-changelog, mirror-and-release)
      contents: write
      # OIDC trusted publishing to npm (deploy-to-npm, mirror-and-release)
      id-token: write
      # disable/enable workflows in the mirror repo (mirror-and-release)
      actions: write
